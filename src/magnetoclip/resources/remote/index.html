<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D14">
<link rel="icon" type="image/png" href="/icon.png">
<title>MagnetoClip Remote</title>
<style>
:root{
  --bg:#0B0D14;--surface:#131624;--surface-alt:#1A1E31;--border:#262B44;
  --text:#E6E9F5;--muted:#8A92B5;--accent:#8B5CF6;--cyan:#22D3EE;
  --success:#34D399;--warning:#FBBF24;--danger:#F87171;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);padding-bottom:96px;
}
header{
  position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;
  padding:14px 16px;background:rgba(11,13,20,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}
.logo{width:28px;height:28px;border-radius:8px;object-fit:contain;flex-shrink:0}
h1{font-size:16px;font-weight:700}
.sub{font-size:12px;color:var(--muted)}
main{padding:12px 12px 0;max-width:560px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pill{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;flex-shrink:0}
.pill.downloading,.pill.connecting,.pill.retrying{background:rgba(139,92,246,.18);color:var(--accent)}
.pill.verifying{background:rgba(34,211,238,.15);color:var(--cyan)}
.pill.paused,.pill.queued,.pill.scheduled{background:rgba(251,191,36,.14);color:var(--warning)}
.pill.completed,.pill.seeding{background:rgba(52,211,153,.15);color:var(--success)}
.pill.failed,.pill.verification_failed,.pill.stopped{background:rgba(248,113,113,.15);color:var(--danger)}
.bar{height:6px;border-radius:3px;background:var(--surface-alt);margin:10px 0 8px;overflow:hidden}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#a78bfa);transition:width .4s ease}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.btns{display:flex;gap:8px;margin-top:10px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:9px;font-weight:600}
.act{flex:1;padding:9px 0;font-size:12.5px;background:var(--surface-alt);color:var(--text);
  border:1px solid var(--border)}
.act:active{transform:scale(.97)}
.act.primary{background:var(--accent);border-color:transparent;color:#fff}
.act.danger{color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:48px 20px;font-size:14px;line-height:1.6}
.fab{position:fixed;right:18px;bottom:22px;width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:28px;line-height:1;
  box-shadow:0 8px 24px rgba(139,92,246,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--border);border-radius:20px 20px 0 0;padding:18px 16px 28px;
  transform:translateY(105%);transition:transform .25s ease}
.sheet.open{transform:translateY(0)}
.sheet h2{font-size:15px;margin-bottom:12px}
.sheet input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface-alt);color:var(--text);font-size:14px;outline:none}
.sheet input:focus{border-color:var(--accent)}
.sheet .go{width:100%;margin-top:12px;padding:13px 0;background:var(--accent);color:#fff;font-size:15px}
.err{color:var(--danger);font-size:12.5px;margin-top:8px;display:none}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:25;opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.on{opacity:1;pointer-events:auto}
.pair{max-width:420px;margin:80px auto;text-align:center;padding:0 24px;color:var(--muted);line-height:1.7}
.pair b{color:var(--text)}
</style>
</head>
<body>
<header>
  <img class="logo" src="/icon.png" alt="MagnetoClip">
  <div style="flex:1">
    <h1>MagnetoClip</h1>
    <div class="sub" id="status"><span id="activeCount">0</span> active · <span id="totalSpeed">0 B/s</span></div>
  </div>
</header>
<main id="list"><div class="empty">Loading…</div></main>

<button class="fab" id="fab">+</button>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <h2>Add URL or magnet link</h2>
  <input id="urlInput" type="url" placeholder="https://… or magnet:?xt=…" autocomplete="off">
  <div class="err" id="addErr"></div>
  <button class="go" id="addBtn">Add download</button>
</div>

<script>
(function(){
"use strict";
var TOKEN=null, timer=null, items=[];

function readToken(){
  var m=location.hash.match(/pair=([A-Za-z0-9_\-]+)/);
  if(m){TOKEN=m[1];localStorage.setItem("mclip_token",TOKEN);
    history.replaceState(null,"",location.pathname);}
  if(!TOKEN)TOKEN=localStorage.getItem("mclip_token");
}

function api(path,opts){
  opts=opts||{};
  opts.headers=Object.assign({"Content-Type":"application/json"},opts.headers,{Authorization:"Bearer "+TOKEN});
  return fetch("/api"+path+"?token="+encodeURIComponent(TOKEN),opts)
    .then(function(r){
      if(r.status===401){showPair();throw new Error("unauthorized");}
      return r.json().then(function(j){if(!r.ok)throw new Error(j.error||r.status);return j;});
    });
}

function fmtBytes(n){
  n=Number(n)||0;
  if(n<=0)return "0 B";
  var u=["B","KB","MB","GB","TB"],i=Math.floor(Math.log(n)/Math.log(1024));
  return (n/Math.pow(1024,i)).toFixed(i?1:0)+" "+u[i];
}
function fmtSpeed(n){return fmtBytes(n)+"/s";}
function fmtEta(s){
  s=Math.round(Number(s));
  if(!s||s<0||!isFinite(s))return "—";
  if(s<60)return s+"s";
  if(s<3600)return Math.floor(s/60)+"m "+(s%60)+"s";
  if(s<86400)return Math.floor(s/3600)+"h "+Math.floor((s%3600)/60)+"m";
  return Math.floor(s/86400)+"d "+Math.floor((s%86400)/3600)+"h";
}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}

function actionsFor(it){
  var st=it.status,a=[];
  if(st==="downloading"||st==="connecting"||st==="retrying"||st==="verifying"){
    a.push(["pause","Pause",""]);
  }else if(st==="paused"){
    a.push(["resume","Resume","primary"]);
  }else if(st==="failed"||st==="verification_failed"){
    a.push(["retry","Retry","primary"]);
  }else if(st!=="completed"){
    a.push(["start","Start","primary"]);
  }
  a.push(["remove","Remove","danger"]);
  return a;
}

function render(){
  var list=document.getElementById("list");
  if(!items.length){list.innerHTML='<div class="empty">No downloads yet.<br>Tap + to add one.</div>';return;}
  var html="";
  items.forEach(function(it,idx){
    var total=Number(it.size_total)||0,got=Number(it.size_downloaded)||0;
    var pct=total>0?Math.min(100,got/total*100):(it.status==="completed"?100:0);
    html+='<div class="card">'
      +'<div class="row"><span class="name">'+esc(it.filename)+'</span>'
      +'<span class="pill '+esc(it.status)+'">'+esc(it.status)+'</span></div>'
      +'<div class="bar"><div data-bar="'+idx+'" style="width:'+pct.toFixed(1)+'%"></div></div>'
      +'<div class="meta"><span>'+fmtBytes(got)+' / '+fmtBytes(total)+'</span>'
      +'<span>'+fmtSpeed(it.speed)+' · ETA '+fmtEta(it.eta_seconds)+'</span></div>'
      +'<div class="btns">';
    actionsFor(it).forEach(function(a){
      html+='<button class="act '+a[2]+'" data-id="'+it.id+'" data-act="'+a[0]+'">'+a[1]+'</button>';
    });
    html+="</div></div>";
  });
  list.innerHTML=html;
}

function refresh(){
  return api("/downloads").then(function(j){
    document.getElementById("activeCount").textContent=j.active_count;
    document.getElementById("totalSpeed").textContent=fmtSpeed(j.total_speed);
    if(!document.getElementById("sheet").classList.contains("open"))items=j.downloads;
    render();
  }).catch(function(){});
}

document.getElementById("list").addEventListener("click",function(e){
  var btn=e.target.closest("button[data-act]");
  if(!btn)return;
  var id=btn.getAttribute("data-id"),act=btn.getAttribute("data-act");
  btn.disabled=true;
  api("/downloads/"+id+"/"+act,{method:"POST"})
    .then(refresh).catch(function(){}).finally(function(){btn.disabled=false;});
});

var sheet=document.getElementById("sheet"),backdrop=document.getElementById("backdrop");
function openSheet(o){sheet.classList.toggle("open",o);backdrop.classList.toggle("on",o);
  if(o)setTimeout(function(){document.getElementById("urlInput").focus();},250);}
document.getElementById("fab").onclick=function(){openSheet(true);};
backdrop.onclick=function(){openSheet(false);};

function doAdd(){
  var inp=document.getElementById("urlInput"),err=document.getElementById("addErr");
  var url=inp.value.trim();
  err.style.display="none";
  if(!url){err.textContent="Paste a URL or magnet link first.";err.style.display="block";return;}
  api("/add",{method:"POST",body:JSON.stringify({url:url})})
    .then(function(){inp.value="";openSheet(false);return refresh();})
    .catch(function(ex){err.textContent=ex.message;err.style.display="block";});
}
document.getElementById("addBtn").onclick=doAdd;
document.getElementById("urlInput").addEventListener("keydown",function(e){
  if(e.key==="Enter")doAdd();});

function showPair(){
  if(timer)clearInterval(timer);
  document.getElementById("list").innerHTML=
    '<div class="pair"><b>Pairing required.</b><br>Scan the QR code from '
    +'MagnetoClip → Settings → Remote Control,<br>or open this page using its link.</div>';
}

readToken();
if(TOKEN){refresh();timer=setInterval(refresh,1000);}else{showPair();}
})();
</script>
</body>
</html>
